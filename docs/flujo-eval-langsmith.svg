<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">pregunta pasa por gate_entrada usando GUARD_MODEL, luego agente usando GEN_MODEL, luego gate_salida usando GUARD_MODEL de nuevo; ambos son gpt-5.6-luna en produccion; si cualquiera de las dos guardas bloquea, sale por respuesta_segura y solo aplican 2 metricas; si pasa las dos, sale por respuesta_ok y aplican las 6 metricas</desc>
