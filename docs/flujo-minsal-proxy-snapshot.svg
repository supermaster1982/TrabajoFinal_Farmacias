<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cadena de resiliencia de la consulta a MINSAL: proxy en Santiago, snapshot como respaldo, error como último caso</title>
<desc>El backend llama al proxy en Cloud Run Santiago, que consulta MINSAL con IP chilena y esquiva el bloqueo de Cloudflare. Si el proxy falla, cae al snapshot rotulado con fecha. Si tampoco hay snapshot, devuelve un mensaje de error digno.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="440" fill="#FCFCFB"/>

<rect x="250" y="20" width="180" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">tool_minsal.py</text>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">consulta farmacias</text>
<line x1="340" y1="70" x2="340" y2="100" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="104" width="220" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="124" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Proxy · Cloud Run Santiago</text>
<text x="340" y="144" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">IP chilena, esquiva Cloudflare</text>

<line x1="450" y1="134" x2="530" y2="134" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="530" y="108" width="110" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="585" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">MINSAL</text>
<text x="585" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">en vivo</text>

<text x="470" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">si el proxy falla</text>
<line x1="340" y1="164" x2="340" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="216" width="220" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Snapshot local</text>
<text x="340" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">rotulado con fecha visible</text>

<text x="470" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">si no hay snapshot</text>
<line x1="340" y1="276" x2="340" y2="324" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="328" width="220" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Mensaje de error digno</text>
<text x="340" y="368" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">ofrece reintentar</text>
</svg>
