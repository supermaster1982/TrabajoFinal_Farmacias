<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cadena de fallback para GEN_MODEL</title>
<desc>El agente usa ChatOpenAI.with_fallbacks() para probar gpt-5.6-luna, luego gpt-5.4-mini, luego gpt-5.4-nano</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="340" fill="#FCFCFB"/>
<text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52514E">agente (respuesta final)</text>
<rect x="190" y="46" width="300" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">model.with_fallbacks()</text>
<line x1="340" y1="90" x2="340" y2="122" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow3)"/>
<rect x="50" y="130" width="170" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="135" y="152" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">gpt-5.6-luna</text>
<line x1="220" y1="152" x2="252" y2="152" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow3)"/>
<rect x="260" y="130" width="160" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">gpt-5.4-mini</text>
<line x1="420" y1="152" x2="452" y2="152" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow3)"/>
<rect x="460" y="130" width="170" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="545" y="152" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">gpt-5.4-nano</text>
<text x="340" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52514E">si falla el anterior, prueba el siguiente</text>
<line x1="340" y1="216" x2="340" y2="240" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="340" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52514E">reasoning_effort="none" aplicado condicionalmente a gpt-5.6.x</text>
<text x="340" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52514E">reintenta la invocación completa, no continúa desde donde quedó</text>
</svg>
