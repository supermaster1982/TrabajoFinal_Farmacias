<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">El agente ReAct usa cuatro tools: dos consultan MINSAL en vivo, una busca en el vademécum internacional directo, y otra consulta el vademécum chileno a través de un servidor MCP aparte, que internamente hace retrieve, filtro y verificación contra Qdrant.</desc>
