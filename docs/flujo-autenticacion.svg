<svg width="680" height="836" viewBox="0 0 680 836" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Flujo de autenticación por sesión anónima firmada</title>
<desc>El navegador crea una sesión, guarda el token, lo manda en cada pregunta, y lo renueva con la respuesta. Un token falsificado es rechazado por el servidor.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="836" fill="#ffffff"/>
<text x="170.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Navegador</text>
<line x1="40" y1="40" x2="300" y2="40" stroke="#888780" stroke-width="0.5"/>
<text x="510.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Servidor</text>
<line x1="380" y1="40" x2="640" y2="40" stroke="#888780" stroke-width="0.5"/>
<line x1="170.0" y1="114" x2="170.0" y2="140" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="300" y1="159.0" x2="380" y2="239.0" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="510.0" y1="274" x2="510.0" y2="300" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="380" y1="319.0" x2="300" y2="383.0" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="170.0" y1="402" x2="170.0" y2="428" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="300" y1="455.0" x2="380" y2="543.0" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="510.0" y1="578" x2="510.0" y2="604" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="380" y1="623.0" x2="300" y2="695.0" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="40" y="60" width="260" height="54" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="52" y="82" font-family="sans-serif" font-size="12" fill="#2c2c2a">Carga la página. ¿Hay token</text>
<text x="52" y="98" font-family="sans-serif" font-size="12" fill="#2c2c2a">guardado? No.</text>
<rect x="40" y="140" width="260" height="38" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="52" y="162" font-family="sans-serif" font-size="12" fill="#04342c">POST /session</text>
<rect x="380" y="204" width="260" height="70" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="392" y="226" font-family="sans-serif" font-size="12" fill="#2c2c2a">Genera un ID aleatorio (uuid4, sin</text>
<text x="392" y="242" font-family="sans-serif" font-size="12" fill="#2c2c2a">datos personales) y lo firma (JWT,</text>
<text x="392" y="258" font-family="sans-serif" font-size="12" fill="#2c2c2a">45 min)</text>
<rect x="380" y="300" width="260" height="38" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="392" y="322" font-family="sans-serif" font-size="12" fill="#04342c">{ token }</text>
<rect x="40" y="364" width="260" height="38" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="52" y="386" font-family="sans-serif" font-size="12" fill="#2c2c2a">Guarda el token en localStorage</text>
<rect x="40" y="428" width="260" height="54" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="52" y="450" font-family="sans-serif" font-size="12" fill="#04342c">POST /chat + Authorization: Bearer</text>
<text x="52" y="466" font-family="sans-serif" font-size="12" fill="#04342c">&lt;token&gt;</text>
<rect x="380" y="508" width="260" height="70" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="392" y="530" font-family="sans-serif" font-size="12" fill="#2c2c2a">Verifica la firma, extrae el ID</text>
<text x="392" y="546" font-family="sans-serif" font-size="12" fill="#2c2c2a">real, lo usa como identificador de</text>
<text x="392" y="562" font-family="sans-serif" font-size="12" fill="#2c2c2a">la conversación</text>
<rect x="380" y="604" width="260" height="38" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="392" y="626" font-family="sans-serif" font-size="12" fill="#04342c">{ respuesta, token renovado }</text>
<rect x="40" y="668" width="260" height="54" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="52" y="690" font-family="sans-serif" font-size="12" fill="#2c2c2a">Reemplaza el token guardado (otros</text>
<text x="52" y="706" font-family="sans-serif" font-size="12" fill="#2c2c2a">45 min de vida)</text>
<line x1="170.0" y1="722" x2="170.0" y2="750" stroke="#a32d2d" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow-danger)"/>
<rect x="40" y="752" width="600" height="54" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
<text x="52" y="774" font-family="sans-serif" font-size="12" fill="#501313">Alguien intenta un token inventado o con otra firma -&gt; el servidor lo rechaza (401) -&gt; nunca</text>
<text x="52" y="790" font-family="sans-serif" font-size="12" fill="#501313">llega a leer ni mezclar el historial de otra persona</text>
</svg>