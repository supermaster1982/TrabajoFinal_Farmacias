<svg width="680" height="928" viewBox="0 0 680 928" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Flujo de autenticación por sesión anónima firmada</title>
<desc>El navegador crea una sesión con un nombre amigable, guarda el token, y lo manda en cada pregunta sin que se renueve — dura 45 minutos fijos desde que se crea. Un token falsificado es rechazado por el servidor.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="928" fill="#ffffff"/>
<text x="170.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Navegador</text>
<line x1="40" y1="40" x2="300" y2="40" stroke="#888780" stroke-width="0.5"/>
<text x="510.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Servidor</text>
<line x1="380" y1="40" x2="640" y2="40" stroke="#888780" stroke-width="0.5"/>

<line x1="170" y1="114" x2="170" y2="140" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="300" y1="159" x2="380" y2="239" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="510" y1="274" x2="510" y2="300" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="380" y1="319" x2="300" y2="391" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="170" y1="418" x2="170" y2="444" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="300" y1="471" x2="380" y2="559" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="510" y1="594" x2="510" y2="620" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="380" y1="639" x2="300" y2="711" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="170" y1="738" x2="170" y2="764" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="170" y1="818" x2="170" y2="844" stroke="#a32d2d" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow-danger)"/>

<rect x="40" y="60" width="260" height="54" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="52" y="82" font-family="sans-serif" font-size="12" fill="#2c2c2a">Carga la página. ¿Hay token</text>
<text x="52" y="98" font-family="sans-serif" font-size="12" fill="#2c2c2a">guardado? No.</text>

<rect x="40" y="140" width="260" height="38" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="52" y="162" font-family="sans-serif" font-size="12" fill="#04342c">POST /session</text>

<rect x="380" y="204" width="260" height="70" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="392" y="226" font-family="sans-serif" font-size="12" fill="#2c2c2a">Genera un nombre amigable (Faker,</text>
<text x="392" y="242" font-family="sans-serif" font-size="12" fill="#2c2c2a">sin datos personales) y lo firma</text>
<text x="392" y="258" font-family="sans-serif" font-size="12" fill="#2c2c2a">(JWT, 45 min fijos, sin renovar)</text>

<rect x="380" y="300" width="260" height="38" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="392" y="322" font-family="sans-serif" font-size="12" fill="#04342c">{ user_id, token }</text>

<rect x="40" y="364" width="260" height="54" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="52" y="386" font-family="sans-serif" font-size="12" fill="#2c2c2a">Guarda user_id y token en</text>
<text x="52" y="402" font-family="sans-serif" font-size="12" fill="#2c2c2a">localStorage; muestra el nombre</text>

<rect x="40" y="444" width="260" height="54" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="52" y="466" font-family="sans-serif" font-size="12" fill="#04342c">POST /chat + Authorization: Bearer</text>
<text x="52" y="482" font-family="sans-serif" font-size="12" fill="#04342c">&lt;token&gt;</text>

<rect x="380" y="524" width="260" height="70" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="392" y="546" font-family="sans-serif" font-size="12" fill="#2c2c2a">Verifica la firma, extrae el</text>
<text x="392" y="562" font-family="sans-serif" font-size="12" fill="#2c2c2a">user_id real; lo usa como hilo de</text>
<text x="392" y="578" font-family="sans-serif" font-size="12" fill="#2c2c2a">conversación (persistente en Postgres)</text>

<rect x="380" y="620" width="260" height="38" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="392" y="642" font-family="sans-serif" font-size="12" fill="#04342c">{ respuesta, user_id }</text>

<rect x="40" y="684" width="260" height="54" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="52" y="706" font-family="sans-serif" font-size="12" fill="#2c2c2a">Muestra la respuesta. El mismo token</text>
<text x="52" y="722" font-family="sans-serif" font-size="12" fill="#2c2c2a">se reutiliza — no se renueva</text>

<rect x="40" y="764" width="600" height="54" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="52" y="786" font-family="sans-serif" font-size="12" fill="#2c2c2a">Pasados 45 min fijos, /chat responde 401 — el navegador borra</text>
<text x="52" y="802" font-family="sans-serif" font-size="12" fill="#2c2c2a">el token y pide una sesión nueva (memoria de conversación nueva)</text>

<rect x="40" y="844" width="600" height="54" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
<text x="52" y="866" font-family="sans-serif" font-size="12" fill="#501313">Alguien intenta un token inventado o con otra firma -&gt; el servidor lo rechaza (401) -&gt; nunca</text>
<text x="52" y="882" font-family="sans-serif" font-size="12" fill="#501313">llega a leer ni mezclar el historial de otra persona</text>
</svg>
