<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitectura del asistente de farmacias</title>
<desc>StateGraph con guarda de entrada, agente que ejecuta una de tres herramientas, y guarda de salida, cada guarda con rama de bloqueo hacia un fin independiente.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="520" fill="#ffffff"/>

<line x1="340" y1="66" x2="340" y2="90" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="146" x2="160" y2="190" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="146" x2="430" y2="190" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="160" y1="246" x2="160" y2="270" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="430" y1="246" x2="420" y2="280" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="420" y1="336" x2="260" y2="380" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="420" y1="336" x2="520" y2="380" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="260" y1="436" x2="260" y2="460" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="520" y1="436" x2="520" y2="460" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<text x="200" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">bloqueado</text>
<text x="500" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">permitido</text>
<text x="300" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">bloqueado</text>
<text x="540" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">permitido</text>

<rect x="290" y="30" width="100" height="36" rx="18" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">inicio</text>

<rect x="220" y="90" width="240" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="340" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342c">gate_entrada</text>
<text x="340" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f6e56">¿pide dosis o tratamiento?</text>

<rect x="60" y="190" width="200" height="56" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
<text x="160" y="212" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">respuesta_segura</text>
<text x="160" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#791f1f">rechaza y deriva</text>

<rect x="300" y="190" width="260" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text x="430" y="212" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">agente</text>
<text x="430" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3c3489">elige y ejecuta una tool</text>

<rect x="290" y="280" width="260" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="420" y="302" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342c">gate_salida</text>
<text x="420" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f6e56">¿recomienda algo peligroso?</text>

<rect x="160" y="380" width="200" height="56" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
<text x="260" y="402" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">respuesta_segura</text>
<text x="260" y="420" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#791f1f">rechaza y deriva</text>

<rect x="410" y="380" width="220" height="56" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.5"/>
<text x="520" y="402" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">respuesta_final</text>
<text x="520" y="420" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3b6d11">cita fuente, sin inventar</text>

<rect x="110" y="270" width="100" height="36" rx="18" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="160" y="292" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">fin</text>

<rect x="210" y="460" width="100" height="36" rx="18" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="260" y="482" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">fin</text>

<rect x="470" y="460" width="100" height="36" rx="18" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="520" y="482" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2c2c2a">fin</text>
</svg>
