<svg width="100%" viewBox="0 0 680 480" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Flujo de búsqueda de medicamento con verificación LLM y fallback al vademécum chileno</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">La pregunta va primero al vademécum de Kaggle, que filtra por similitud de embeddings y luego verifica con un LLM si el resultado está realmente relacionado. Si sí, responde rápido con Kaggle en unos 8 a 9 segundos. Si no, intenta el vademécum chileno con su propio filtro y verificación, respondiendo en unos 15 a 16 segundos.</desc>
