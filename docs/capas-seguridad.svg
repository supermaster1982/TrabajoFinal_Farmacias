<svg width="680" height="1312" viewBox="0 0 680 1312" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Capas de defensa en profundidad del asistente de farmacias</title>
<desc>7 capas de seguridad; las capas completamente resueltas se destacan en verde.</desc>
<rect width="680" height="1312" fill="#ffffff"/>
<rect x="40" y="30" width="600" height="144" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="59.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="63.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">1</text>
<text x="84" y="63.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Red y transporte</text>
<circle cx="70" cy="76" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,76 L69.5,78.5 L74,73" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="80" font-family="sans-serif" font-size="12" fill="#2c2c2a">Credenciales fuera del repo (.gitignore)</text>
<circle cx="70" cy="96" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,96 L69.5,98.5 L74,93" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="100" font-family="sans-serif" font-size="12" fill="#2c2c2a">CORS restringido por .env (CORS_ALLOWED_ORIGINS), no abierto a cualquier</text>
<text x="84" y="120" font-family="sans-serif" font-size="12" fill="#2c2c2a">origen</text>
<circle cx="70" cy="136" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,136 L69.5,138.5 L74,133" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="140" font-family="sans-serif" font-size="12" fill="#2c2c2a">Rate limiting en /chat (20 peticiones/60s), probado con servidor real</text>
<rect x="40" y="188" width="600" height="204" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="217.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="221.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">2</text>
<text x="84" y="221.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Autenticación y acceso</text>
<circle cx="70" cy="234" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,234 L69.5,236.5 L74,231" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="238" font-family="sans-serif" font-size="12" fill="#2c2c2a">Sesión anónima firmada (JWT) verifica el identificador — ya no confía en lo</text>
<text x="84" y="258" font-family="sans-serif" font-size="12" fill="#2c2c2a">que mande el cliente</text>
<circle cx="70" cy="274" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,274 L69.5,276.5 L74,271" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="278" font-family="sans-serif" font-size="12" fill="#2c2c2a">Token expira en 45 min y se renueva automáticamente mientras la persona esté</text>
<text x="84" y="298" font-family="sans-serif" font-size="12" fill="#2c2c2a">activa</text>
<circle cx="70" cy="314" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,314 L69.5,316.5 L74,311" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="318" font-family="sans-serif" font-size="12" fill="#2c2c2a">Decisión de diseño documentada: sesión anónima en vez de login real — no hace</text>
<text x="84" y="338" font-family="sans-serif" font-size="12" fill="#2c2c2a">falta saber quién es la persona, solo que el identificador no se pueda</text>
<text x="84" y="358" font-family="sans-serif" font-size="12" fill="#2c2c2a">falsificar (ver docs/por-que-user-id.md)</text>
<rect x="40" y="406" width="600" height="184" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="435.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="439.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">3</text>
<text x="84" y="439.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Validación de entrada (gate_entrada)</text>
<circle cx="70" cy="452" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,452 L69.5,454.5 L74,449" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="456" font-family="sans-serif" font-size="12" fill="#2c2c2a">Bloquea dosis/tratamiento antes de llamar al agente</text>
<circle cx="70" cy="472" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,472 L69.5,474.5 L74,469" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="476" font-family="sans-serif" font-size="12" fill="#2c2c2a">Fail-closed si la guarda falla técnicamente</text>
<circle cx="70" cy="492" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,492 L69.5,494.5 L74,489" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="496" font-family="sans-serif" font-size="12" fill="#2c2c2a">Distingue bloqueo real vs. fallo técnico (503 honesto)</text>
<circle cx="70" cy="512" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,512 L69.5,514.5 L74,509" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="516" font-family="sans-serif" font-size="12" fill="#2c2c2a">Cubre diagnóstico implícito y alergia/contraindicación (probado)</text>
<circle cx="70" cy="532" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,532 L69.5,534.5 L74,529" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="536" font-family="sans-serif" font-size="12" fill="#2c2c2a">Considera el historial de la conversación, no solo el mensaje actual (con</text>
<text x="84" y="556" font-family="sans-serif" font-size="12" fill="#2c2c2a">sesgo conservador conocido en casos límite)</text>
<rect x="40" y="604" width="600" height="224" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="633.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="637.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">4</text>
<text x="84" y="637.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Modelo y prompt</text>
<circle cx="70" cy="650" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,650 L69.5,652.5 L74,647" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="654" font-family="sans-serif" font-size="12" fill="#2c2c2a">No inventa cuando una tool falla (grounding forzado)</text>
<circle cx="70" cy="670" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,670 L69.5,672.5 L74,667" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="674" font-family="sans-serif" font-size="12" fill="#2c2c2a">Cadena de modelos de respaldo ante caída/retiro</text>
<circle cx="70" cy="690" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,690 L69.5,692.5 L74,687" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="694" font-family="sans-serif" font-size="12" fill="#2c2c2a">Filtro de similitud mínima de embeddings en el RAG (evita match incorrecto si</text>
<text x="84" y="714" font-family="sans-serif" font-size="12" fill="#2c2c2a">el medicamento no existe en el corpus)</text>
<circle cx="70" cy="730" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,730 L69.5,732.5 L74,727" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="734" font-family="sans-serif" font-size="12" fill="#2c2c2a">Prioriza sugerir evaluación profesional antes de info, si hay síntoma</text>
<text x="84" y="754" font-family="sans-serif" font-size="12" fill="#2c2c2a">mencionado</text>
<circle cx="70" cy="770" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,770 L69.5,772.5 L74,767" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="774" font-family="sans-serif" font-size="12" fill="#2c2c2a">Límite de iteraciones del agente (recursion_limit=12, calibrado con trazas</text>
<text x="84" y="794" font-family="sans-serif" font-size="12" fill="#2c2c2a">reales)</text>
<rect x="40" y="842" width="600" height="164" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="871.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="875.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">5</text>
<text x="84" y="875.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Validación de salida (gate_salida)</text>
<circle cx="70" cy="888" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,888 L69.5,890.5 L74,885" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="892" font-family="sans-serif" font-size="12" fill="#2c2c2a">Revisa la respuesta final antes de mostrarla</text>
<circle cx="70" cy="908" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,908 L69.5,910.5 L74,905" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="912" font-family="sans-serif" font-size="12" fill="#2c2c2a">Mismo mensaje que gate_entrada — no revela qué capa actuó</text>
<circle cx="70" cy="928" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,928 L69.5,930.5 L74,925" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="932" font-family="sans-serif" font-size="12" fill="#2c2c2a">Probado con diagnóstico implícito y alergia/contraindicación</text>
<circle cx="70" cy="948" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,948 L69.5,950.5 L74,945" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="952" font-family="sans-serif" font-size="12" fill="#2c2c2a">Detecta cuando la indicación de un medicamento coincide con un síntoma</text>
<text x="84" y="972" font-family="sans-serif" font-size="12" fill="#2c2c2a">mencionado antes (evita recomendación implícita)</text>
<rect x="40" y="1020" width="600" height="144" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="1049.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="1053.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">6</text>
<text x="84" y="1053.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Observabilidad y evaluación</text>
<circle cx="70" cy="1066" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,1066 L69.5,1068.5 L74,1063" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="1070" font-family="sans-serif" font-size="12" fill="#2c2c2a">Trazas de todos los nodos (LangSmith)</text>
<circle cx="70" cy="1086" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,1086 L69.5,1088.5 L74,1083" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="1090" font-family="sans-serif" font-size="12" fill="#2c2c2a">Evaluación formal con dataset adversario editable (10 preguntas, 5 métricas)</text>
<circle cx="70" cy="1106" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,1106 L69.5,1108.5 L74,1103" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="1110" font-family="sans-serif" font-size="12" fill="#2c2c2a">Proceso de revisión humana de trazas definido</text>
<text x="84" y="1130" font-family="sans-serif" font-size="12" fill="#2c2c2a">(docs/proceso-revision-trazas.md)</text>
<rect x="40" y="1178" width="600" height="104" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="1207.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="1211.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">7</text>
<text x="84" y="1211.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Gobernanza y cumplimiento</text>
<circle cx="70" cy="1224" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,1224 L69.5,1226.5 L74,1221" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="1228" font-family="sans-serif" font-size="12" fill="#2c2c2a">Informe + matriz de riesgos</text>
<circle cx="70" cy="1244" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,1244 L69.5,1246.5 L74,1241" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="1248" font-family="sans-serif" font-size="12" fill="#2c2c2a">Términos y condiciones de uso, integrados al front (terminos.html)</text>
</svg>