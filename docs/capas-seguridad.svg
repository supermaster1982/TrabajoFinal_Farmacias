<svg width="680" height="1072" viewBox="0 0 680 1072" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Capas de defensa en profundidad del asistente de farmacias</title>
<desc>7 capas de seguridad con controles implementados (verde, con check) y pendientes (ámbar, con reloj).</desc>
<rect width="680" height="1072" fill="#ffffff"/>
<rect x="40" y="30" width="600" height="124" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<circle cx="64" cy="59.0" r="11" fill="#ffffff" stroke="#5f5e5a" stroke-width="1"/>
<text x="64" y="63.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5f5e5a">1</text>
<text x="84" y="63.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Red y transporte</text>
<circle cx="70" cy="76" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,76 L69.5,78.5 L74,73" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="80" font-family="sans-serif" font-size="12" fill="#2c2c2a">Credenciales fuera del repo (.gitignore)</text>
<circle cx="70" cy="96" r="6.5" fill="none" stroke="#854f0b" stroke-width="1.2"/>
<line x1="70" y1="92.5" x2="70" y2="96" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<line x1="70" y1="96" x2="73" y2="97.5" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<text x="84" y="100" font-family="sans-serif" font-size="12" fill="#5f5e5a">CORS abierto (allow_origins=["*"]) — restringir antes de publicar</text>
<circle cx="70" cy="116" r="6.5" fill="none" stroke="#854f0b" stroke-width="1.2"/>
<line x1="70" y1="112.5" x2="70" y2="116" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<line x1="70" y1="116" x2="73" y2="117.5" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<text x="84" y="120" font-family="sans-serif" font-size="12" fill="#5f5e5a">Sin rate limiting — falta</text>
<rect x="40" y="168" width="600" height="104" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<circle cx="64" cy="197.0" r="11" fill="#ffffff" stroke="#5f5e5a" stroke-width="1"/>
<text x="64" y="201.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5f5e5a">2</text>
<text x="84" y="201.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Autenticación y acceso</text>
<circle cx="70" cy="214" r="6.5" fill="none" stroke="#854f0b" stroke-width="1.2"/>
<line x1="70" y1="210.5" x2="70" y2="214" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<line x1="70" y1="214" x2="73" y2="215.5" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<text x="84" y="218" font-family="sans-serif" font-size="12" fill="#5f5e5a">user_id sin verificar — cualquiera lee el historial de otro</text>
<circle cx="70" cy="234" r="6.5" fill="none" stroke="#854f0b" stroke-width="1.2"/>
<line x1="70" y1="230.5" x2="70" y2="234" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<line x1="70" y1="234" x2="73" y2="235.5" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<text x="84" y="238" font-family="sans-serif" font-size="12" fill="#5f5e5a">Login externo (OAuth) — falta, documentado como limitación</text>
<rect x="40" y="286" width="600" height="144" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="315.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="319.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">3</text>
<text x="84" y="319.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Validación de entrada (gate_entrada)</text>
<circle cx="70" cy="332" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,332 L69.5,334.5 L74,329" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="336" font-family="sans-serif" font-size="12" fill="#2c2c2a">Bloquea dosis/tratamiento antes de llamar al agente</text>
<circle cx="70" cy="352" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,352 L69.5,354.5 L74,349" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="356" font-family="sans-serif" font-size="12" fill="#2c2c2a">Fail-closed si la guarda falla técnicamente</text>
<circle cx="70" cy="372" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,372 L69.5,374.5 L74,369" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="376" font-family="sans-serif" font-size="12" fill="#2c2c2a">Distingue bloqueo real vs. fallo técnico (503 honesto)</text>
<circle cx="70" cy="392" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,392 L69.5,394.5 L74,389" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="396" font-family="sans-serif" font-size="12" fill="#2c2c2a">Cubre diagnóstico implícito y alergia/contraindicación (probado)</text>
<rect x="40" y="444" width="600" height="204" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<circle cx="64" cy="473.0" r="11" fill="#ffffff" stroke="#5f5e5a" stroke-width="1"/>
<text x="64" y="477.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5f5e5a">4</text>
<text x="84" y="477.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Modelo y prompt</text>
<circle cx="70" cy="490" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,490 L69.5,492.5 L74,487" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="494" font-family="sans-serif" font-size="12" fill="#2c2c2a">No inventa cuando una tool falla (grounding forzado)</text>
<circle cx="70" cy="510" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,510 L69.5,512.5 L74,507" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="514" font-family="sans-serif" font-size="12" fill="#2c2c2a">Cadena de modelos de respaldo ante caída/retiro</text>
<circle cx="70" cy="530" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,530 L69.5,532.5 L74,527" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="534" font-family="sans-serif" font-size="12" fill="#2c2c2a">Filtro de similitud mínima de embeddings en el RAG (evita match incorrecto si</text>
<text x="84" y="554" font-family="sans-serif" font-size="12" fill="#2c2c2a">el medicamento no existe en el corpus)</text>
<circle cx="70" cy="570" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,570 L69.5,572.5 L74,567" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="574" font-family="sans-serif" font-size="12" fill="#2c2c2a">Prioriza sugerir evaluación profesional antes de info, si hay síntoma</text>
<text x="84" y="594" font-family="sans-serif" font-size="12" fill="#2c2c2a">mencionado</text>
<circle cx="70" cy="610" r="6.5" fill="none" stroke="#854f0b" stroke-width="1.2"/>
<line x1="70" y1="606.5" x2="70" y2="610" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<line x1="70" y1="610" x2="73" y2="611.5" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<text x="84" y="614" font-family="sans-serif" font-size="12" fill="#5f5e5a">Límite de iteraciones del agente (recursion_limit) — falta</text>
<rect x="40" y="662" width="600" height="124" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="691.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="695.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">5</text>
<text x="84" y="695.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Validación de salida (gate_salida)</text>
<circle cx="70" cy="708" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,708 L69.5,710.5 L74,705" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="712" font-family="sans-serif" font-size="12" fill="#2c2c2a">Revisa la respuesta final antes de mostrarla</text>
<circle cx="70" cy="728" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,728 L69.5,730.5 L74,725" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="732" font-family="sans-serif" font-size="12" fill="#2c2c2a">Mismo mensaje que gate_entrada — no revela qué capa actuó</text>
<circle cx="70" cy="748" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,748 L69.5,750.5 L74,745" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="752" font-family="sans-serif" font-size="12" fill="#2c2c2a">Probado con diagnóstico implícito y alergia/contraindicación</text>
<rect x="40" y="800" width="600" height="124" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<circle cx="64" cy="829.0" r="11" fill="#ffffff" stroke="#5f5e5a" stroke-width="1"/>
<text x="64" y="833.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5f5e5a">6</text>
<text x="84" y="833.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Observabilidad y evaluación</text>
<circle cx="70" cy="846" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,846 L69.5,848.5 L74,843" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="850" font-family="sans-serif" font-size="12" fill="#2c2c2a">Trazas de todos los nodos (LangSmith)</text>
<circle cx="70" cy="866" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,866 L69.5,868.5 L74,863" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="870" font-family="sans-serif" font-size="12" fill="#2c2c2a">Evaluación formal con dataset adversario editable (10 preguntas, 5 métricas)</text>
<circle cx="70" cy="886" r="6.5" fill="none" stroke="#854f0b" stroke-width="1.2"/>
<line x1="70" y1="882.5" x2="70" y2="886" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<line x1="70" y1="886" x2="73" y2="887.5" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<text x="84" y="890" font-family="sans-serif" font-size="12" fill="#5f5e5a">Revisión humana periódica de trazas — sin proceso formal</text>
<rect x="40" y="938" width="600" height="104" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<circle cx="64" cy="967.0" r="11" fill="#ffffff" stroke="#5f5e5a" stroke-width="1"/>
<text x="64" y="971.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5f5e5a">7</text>
<text x="84" y="971.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Gobernanza y cumplimiento</text>
<circle cx="70" cy="984" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,984 L69.5,986.5 L74,981" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="988" font-family="sans-serif" font-size="12" fill="#2c2c2a">Informe + matriz de riesgos (19 ítems)</text>
<circle cx="70" cy="1004" r="6.5" fill="none" stroke="#854f0b" stroke-width="1.2"/>
<line x1="70" y1="1000.5" x2="70" y2="1004" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<line x1="70" y1="1004" x2="73" y2="1005.5" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<text x="84" y="1008" font-family="sans-serif" font-size="12" fill="#5f5e5a">Términos y condiciones de uso — falta</text>
</svg>