<svg width="680" height="1152" viewBox="0 0 680 1152" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Capas de defensa en profundidad del asistente de farmacias</title>
<desc>7 capas de seguridad; las capas completamente resueltas se destacan en verde, las que tienen ítems pendientes quedan en gris neutro. Controles individuales: check verde = implementado, reloj ámbar = pendiente.</desc>
<rect width="680" height="1152" fill="#ffffff"/>
<rect x="40" y="30" width="600" height="164" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="59.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="63.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">1</text>
<text x="84" y="63.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Red y transporte</text>
<circle cx="70" cy="76" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,76 L69.5,78.5 L74,73" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="80" font-family="sans-serif" font-size="12" fill="#2c2c2a">Credenciales fuera del repo (.gitignore)</text>
<circle cx="70" cy="96" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,96 L69.5,98.5 L74,93" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="100" font-family="sans-serif" font-size="12" fill="#2c2c2a">CORS restringido por .env (CORS_ALLOWED_ORIGINS), no abierto a cualquier</text>
<text x="84" y="120" font-family="sans-serif" font-size="12" fill="#2c2c2a">origen</text>
<circle cx="70" cy="136" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,136 L69.5,138.5 L74,133" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="140" font-family="sans-serif" font-size="12" fill="#2c2c2a">Rate limiting en /chat (20 peticiones/60s), probado con servidor real</text>
<text x="84" y="160" font-family="sans-serif" font-size="12" fill="#2c2c2a">(evidencia en docs/)</text>
<rect x="40" y="208" width="600" height="104" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<circle cx="64" cy="237.0" r="11" fill="#ffffff" stroke="#5f5e5a" stroke-width="1"/>
<text x="64" y="241.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5f5e5a">2</text>
<text x="84" y="241.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Autenticación y acceso</text>
<circle cx="70" cy="254" r="6.5" fill="none" stroke="#854f0b" stroke-width="1.2"/>
<line x1="70" y1="250.5" x2="70" y2="254" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<line x1="70" y1="254" x2="73" y2="255.5" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<text x="84" y="258" font-family="sans-serif" font-size="12" fill="#5f5e5a">user_id sin verificar — cualquiera lee el historial de otro</text>
<circle cx="70" cy="274" r="6.5" fill="none" stroke="#854f0b" stroke-width="1.2"/>
<line x1="70" y1="270.5" x2="70" y2="274" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<line x1="70" y1="274" x2="73" y2="275.5" stroke="#854f0b" stroke-width="1.1" stroke-linecap="round"/>
<text x="84" y="278" font-family="sans-serif" font-size="12" fill="#5f5e5a">Login externo (OAuth) — falta, documentado como limitación</text>
<rect x="40" y="326" width="600" height="144" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="355.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="359.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">3</text>
<text x="84" y="359.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Validación de entrada (gate_entrada)</text>
<circle cx="70" cy="372" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,372 L69.5,374.5 L74,369" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="376" font-family="sans-serif" font-size="12" fill="#2c2c2a">Bloquea dosis/tratamiento antes de llamar al agente</text>
<circle cx="70" cy="392" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,392 L69.5,394.5 L74,389" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="396" font-family="sans-serif" font-size="12" fill="#2c2c2a">Fail-closed si la guarda falla técnicamente</text>
<circle cx="70" cy="412" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,412 L69.5,414.5 L74,409" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="416" font-family="sans-serif" font-size="12" fill="#2c2c2a">Distingue bloqueo real vs. fallo técnico (503 honesto)</text>
<circle cx="70" cy="432" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,432 L69.5,434.5 L74,429" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="436" font-family="sans-serif" font-size="12" fill="#2c2c2a">Cubre diagnóstico implícito y alergia/contraindicación (probado)</text>
<rect x="40" y="484" width="600" height="224" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="513.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="517.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">4</text>
<text x="84" y="517.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Modelo y prompt</text>
<circle cx="70" cy="530" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,530 L69.5,532.5 L74,527" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="534" font-family="sans-serif" font-size="12" fill="#2c2c2a">No inventa cuando una tool falla (grounding forzado)</text>
<circle cx="70" cy="550" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,550 L69.5,552.5 L74,547" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="554" font-family="sans-serif" font-size="12" fill="#2c2c2a">Cadena de modelos de respaldo ante caída/retiro</text>
<circle cx="70" cy="570" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,570 L69.5,572.5 L74,567" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="574" font-family="sans-serif" font-size="12" fill="#2c2c2a">Filtro de similitud mínima de embeddings en el RAG (evita match incorrecto si</text>
<text x="84" y="594" font-family="sans-serif" font-size="12" fill="#2c2c2a">el medicamento no existe en el corpus)</text>
<circle cx="70" cy="610" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,610 L69.5,612.5 L74,607" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="614" font-family="sans-serif" font-size="12" fill="#2c2c2a">Prioriza sugerir evaluación profesional antes de info, si hay síntoma</text>
<text x="84" y="634" font-family="sans-serif" font-size="12" fill="#2c2c2a">mencionado</text>
<circle cx="70" cy="650" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,650 L69.5,652.5 L74,647" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="654" font-family="sans-serif" font-size="12" fill="#2c2c2a">Límite de iteraciones del agente (recursion_limit=12, calibrado con trazas</text>
<text x="84" y="674" font-family="sans-serif" font-size="12" fill="#2c2c2a">reales)</text>
<rect x="40" y="722" width="600" height="124" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="751.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="755.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">5</text>
<text x="84" y="755.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Validación de salida (gate_salida)</text>
<circle cx="70" cy="768" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,768 L69.5,770.5 L74,765" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="772" font-family="sans-serif" font-size="12" fill="#2c2c2a">Revisa la respuesta final antes de mostrarla</text>
<circle cx="70" cy="788" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,788 L69.5,790.5 L74,785" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="792" font-family="sans-serif" font-size="12" fill="#2c2c2a">Mismo mensaje que gate_entrada — no revela qué capa actuó</text>
<circle cx="70" cy="808" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,808 L69.5,810.5 L74,805" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="812" font-family="sans-serif" font-size="12" fill="#2c2c2a">Probado con diagnóstico implícito y alergia/contraindicación</text>
<rect x="40" y="860" width="600" height="144" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="889.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="893.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">6</text>
<text x="84" y="893.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Observabilidad y evaluación</text>
<circle cx="70" cy="906" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,906 L69.5,908.5 L74,903" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="910" font-family="sans-serif" font-size="12" fill="#2c2c2a">Trazas de todos los nodos (LangSmith)</text>
<circle cx="70" cy="926" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,926 L69.5,928.5 L74,923" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="930" font-family="sans-serif" font-size="12" fill="#2c2c2a">Evaluación formal con dataset adversario editable (10 preguntas, 5 métricas)</text>
<circle cx="70" cy="946" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,946 L69.5,948.5 L74,943" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="950" font-family="sans-serif" font-size="12" fill="#2c2c2a">Proceso de revisión humana de trazas definido</text>
<text x="84" y="970" font-family="sans-serif" font-size="12" fill="#2c2c2a">(docs/proceso-revision-trazas.md)</text>
<rect x="40" y="1018" width="600" height="104" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="64" cy="1047.0" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/>
<text x="64" y="1051.0" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f6e56">7</text>
<text x="84" y="1051.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Gobernanza y cumplimiento</text>
<circle cx="70" cy="1064" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,1064 L69.5,1066.5 L74,1061" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="1068" font-family="sans-serif" font-size="12" fill="#2c2c2a">Informe + matriz de riesgos (19 ítems)</text>
<circle cx="70" cy="1084" r="6.5" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<path d="M67,1084 L69.5,1086.5 L74,1081" fill="none" stroke="#3b6d11" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="1088" font-family="sans-serif" font-size="12" fill="#2c2c2a">Términos y condiciones de uso, integrados al front (terminos.html)</text>
</svg>