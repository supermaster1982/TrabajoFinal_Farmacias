<svg width="680" height="640" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitectura ilustrada del asistente de farmacias</title>
<desc>Guarda de entrada (bloquea también síntoma+medicamento en el mismo mensaje), agente que elige entre cuatro herramientas (dos de MINSAL vía proxy con caché de 15 minutos, vademécum de Kaggle con verificación LLM, y vademécum chileno como fallback vía protocolo MCP en un servidor aparte), y guarda de salida, con íconos simples por cada pieza.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="640" fill="#ffffff"/>

<!-- ===== Conectores ===== -->
<line x1="340" y1="66" x2="340" y2="90" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="146" x2="160" y2="190" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="146" x2="430" y2="190" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M160,246 L160,266 L45,266 L45,560 L85,560" fill="none" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="430" y1="246" x2="100" y2="280" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="430" y1="246" x2="255" y2="280" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="430" y1="246" x2="410" y2="280" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="430" y1="246" x2="565" y2="280" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="100" y1="344" x2="300" y2="384" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="255" y1="344" x2="355" y2="384" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="410" y1="344" x2="420" y2="384" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="565" y1="344" x2="500" y2="384" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="420" y1="440" x2="280" y2="480" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="420" y1="440" x2="530" y2="480" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="330" y="466" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">bloqueado</text>
<text x="495" y="466" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">permitido</text>
<line x1="280" y1="536" x2="280" y2="560" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="530" y1="536" x2="530" y2="560" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<text x="200" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">bloqueado</text>
<text x="500" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">permitido</text>

<!-- ===== inicio ===== -->
<rect x="290" y="30" width="100" height="36" rx="18" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2c2c2a">inicio</text>

<!-- ===== gate_entrada (ícono escudo) ===== -->
<rect x="200" y="90" width="280" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<path d="M220,104 L230,101 L240,104 L240,114 Q240,122 230,127 Q220,122 220,114 Z" fill="none" stroke="#0f6e56" stroke-width="1.3"/>
<path d="M225,113 L229,117 L236,108" fill="none" stroke="#0f6e56" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="258" y="112" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342c">gate_entrada</text>
<text x="258" y="130" font-family="sans-serif" font-size="11" fill="#0f6e56">¿pide algo personalizado?</text>

<!-- ===== respuesta_segura (1) — ícono stop ===== -->
<rect x="60" y="190" width="200" height="56" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
<circle cx="85" cy="212" r="11" fill="none" stroke="#a32d2d" stroke-width="1.3"/>
<line x1="79" y1="212" x2="91" y2="212" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round"/>
<text x="103" y="212" font-family="sans-serif" font-size="13" font-weight="600" fill="#501313">respuesta_segura</text>
<text x="103" y="230" font-family="sans-serif" font-size="11" fill="#791f1f">rechaza y deriva</text>

<!-- ===== agente (ícono robot) ===== -->
<rect x="300" y="190" width="260" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<rect x="322" y="203" width="22" height="17" rx="4" fill="none" stroke="#3c3489" stroke-width="1.3"/>
<line x1="333" y1="203" x2="333" y2="198" stroke="#3c3489" stroke-width="1.3"/>
<circle cx="333" cy="196" r="1.6" fill="#3c3489"/>
<circle cx="329" cy="211" r="1.6" fill="#3c3489"/>
<circle cx="337" cy="211" r="1.6" fill="#3c3489"/>
<text x="356" y="212" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215c">agente</text>
<text x="356" y="230" font-family="sans-serif" font-size="11" fill="#3c3489">elige y ejecuta una tool</text>

<!-- ===== tool 1: farmacias de turno (ícono edificio) ===== -->
<rect x="30" y="280" width="140" height="64" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.5"/>
<rect x="42" y="292" width="20" height="24" fill="none" stroke="#3b6d11" stroke-width="1.2"/>
<line x1="46" y1="297" x2="49" y2="297" stroke="#3b6d11" stroke-width="1"/>
<line x1="54" y1="297" x2="57" y2="297" stroke="#3b6d11" stroke-width="1"/>
<line x1="46" y1="303" x2="49" y2="303" stroke="#3b6d11" stroke-width="1"/>
<line x1="54" y1="303" x2="57" y2="303" stroke="#3b6d11" stroke-width="1"/>
<text x="72" y="298" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#173404">Turno</text>
<text x="72" y="313" font-family="sans-serif" font-size="9.5" fill="#3b6d11">MINSAL, vía proxy</text>
<circle cx="38" cy="328" r="3.5" fill="none" stroke="#5f5e5a" stroke-width="0.8"/>
<line x1="38" y1="326" x2="38" y2="328" stroke="#5f5e5a" stroke-width="0.7"/>
<line x1="38" y1="328" x2="39.5" y2="329.5" stroke="#5f5e5a" stroke-width="0.7"/>
<text x="45" y="331" font-family="sans-serif" font-size="9" fill="#5f5e5a">caché 15 min</text>

<!-- ===== tool 2: directorio completo (ícono lista) ===== -->
<rect x="185" y="280" width="140" height="64" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.5"/>
<line x1="197" y1="296" x2="213" y2="296" stroke="#3b6d11" stroke-width="1.4" stroke-linecap="round"/>
<line x1="197" y1="303" x2="213" y2="303" stroke="#3b6d11" stroke-width="1.4" stroke-linecap="round"/>
<line x1="197" y1="310" x2="213" y2="310" stroke="#3b6d11" stroke-width="1.4" stroke-linecap="round"/>
<text x="223" y="298" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#173404">Directorio</text>
<text x="223" y="313" font-family="sans-serif" font-size="9.5" fill="#3b6d11">MINSAL, vía proxy</text>
<circle cx="193" cy="328" r="3.5" fill="none" stroke="#5f5e5a" stroke-width="0.8"/>
<line x1="193" y1="326" x2="193" y2="328" stroke="#5f5e5a" stroke-width="0.7"/>
<line x1="193" y1="328" x2="194.5" y2="329.5" stroke="#5f5e5a" stroke-width="0.7"/>
<text x="200" y="331" font-family="sans-serif" font-size="9" fill="#5f5e5a">caché 15 min</text>

<!-- ===== tool 3: vademécum Kaggle (ícono píldora) ===== -->
<rect x="340" y="280" width="140" height="64" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.5"/>
<rect x="352" y="298" width="24" height="12" rx="6" fill="none" stroke="#3b6d11" stroke-width="1.3"/>
<line x1="364" y1="298" x2="364" y2="310" stroke="#3b6d11" stroke-width="1"/>
<text x="382" y="298" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#173404">Vademécum</text>
<text x="382" y="313" font-family="sans-serif" font-size="9.5" fill="#3b6d11">Kaggle · RAG directo</text>
<text x="352" y="331" font-family="sans-serif" font-size="9" fill="#5f5e5a">+ verificación LLM</text>

<!-- ===== tool 4: vademécum chileno vía MCP (ícono protocolo) ===== -->
<rect x="495" y="280" width="140" height="64" rx="8" fill="#fbeaf0" stroke="#993556" stroke-width="0.5"/>
<circle cx="509" cy="299" r="4" fill="none" stroke="#993556" stroke-width="1.2"/>
<circle cx="521" cy="309" r="4" fill="none" stroke="#993556" stroke-width="1.2"/>
<line x1="512" y1="302" x2="518" y2="306" stroke="#993556" stroke-width="1.2"/>
<text x="527" y="298" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#4b1528">Vademécum CL</text>
<text x="527" y="313" font-family="sans-serif" font-size="9.5" fill="#993556">protocolo MCP</text>
<text x="507" y="331" font-family="sans-serif" font-size="9" fill="#5f5e5a">servidor aparte · fallback</text>

<!-- ===== gate_salida (ícono escudo) ===== -->
<rect x="290" y="384" width="260" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<path d="M310,398 L320,395 L330,398 L330,408 Q330,416 320,421 Q310,416 310,408 Z" fill="none" stroke="#0f6e56" stroke-width="1.3"/>
<path d="M315,407 L319,411 L326,402" fill="none" stroke="#0f6e56" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="348" y="406" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342c">gate_salida</text>
<text x="348" y="424" font-family="sans-serif" font-size="11" fill="#0f6e56">¿recomienda algo peligroso?</text>

<!-- ===== respuesta_segura (2) — ícono stop ===== -->
<rect x="180" y="480" width="200" height="56" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
<circle cx="205" cy="502" r="11" fill="none" stroke="#a32d2d" stroke-width="1.3"/>
<line x1="199" y1="502" x2="211" y2="502" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round"/>
<text x="223" y="502" font-family="sans-serif" font-size="13" font-weight="600" fill="#501313">respuesta_segura</text>
<text x="223" y="520" font-family="sans-serif" font-size="11" fill="#791f1f">rechaza y deriva</text>

<!-- ===== respuesta_final — ícono check ===== -->
<rect x="420" y="480" width="220" height="56" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.5"/>
<circle cx="445" cy="502" r="11" fill="none" stroke="#3b6d11" stroke-width="1.3"/>
<path d="M439,502 L444,507 L452,496" fill="none" stroke="#3b6d11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="463" y="502" font-family="sans-serif" font-size="13" font-weight="600" fill="#173404">respuesta_final</text>
<text x="463" y="520" font-family="sans-serif" font-size="11" fill="#3b6d11">cita fuente</text>

<!-- ===== fin (x3) ===== -->
<rect x="40" y="560" width="90" height="36" rx="18" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="85" y="582" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2c2c2a">fin</text>
<rect x="230" y="560" width="100" height="36" rx="18" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="280" y="582" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2c2c2a">fin</text>
<rect x="480" y="560" width="100" height="36" rx="18" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="530" y="582" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2c2c2a">fin</text>
</svg>
